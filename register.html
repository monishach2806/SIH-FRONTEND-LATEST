<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Register | Srijian Bank</title>
	<link rel="stylesheet" href="register.css">
</head>
<body>
	<main class="register-page">
		<section class="register-card" aria-labelledby="register-title">
			<img class="register-logo" src="logo.jpeg" alt="Srijian - Let AI Handle Your Finances">
			<div class="heading-block">
				<p class="eyebrow">Welcome to smarter banking</p>
				<h1 id="register-title">Open your Srijian account</h1>
				<p class="intro">Complete your details to get started with secure, simple banking.</p>
			</div>

			<form class="register-form" action="#" method="post">
				<fieldset>
					<legend>Personal details</legend>
					<div class="form-grid">
						<div class="form-field field-wide">
							<label for="fullName">Full name</label>
							<input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="Enter your full name" required>
						</div>
						<div class="form-field">
							<label for="dateOfBirth">Date of birth</label>
							<input type="date" id="dateOfBirth" name="dateOfBirth" required>
						</div>
						<div class="form-field">
							<label for="occupation">Occupation</label>
							<select id="occupation" name="occupation" required>
								<option value="">Select occupation</option>
								<option>Student</option>
								<option>Salaried</option>
								<option>Self-employed</option>
								<option>Business owner</option>
								<option>Retired</option>
							</select>
						</div>
					</div>
				</fieldset>

				<fieldset>
					<legend>Contact and address</legend>
					<div class="form-grid">
						<div class="form-field">
							<label for="mobileNumber">Mobile number</label>
							<input type="tel" id="mobileNumber" name="mobileNumber" autocomplete="tel" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
						</div>
						<div class="form-field">
							<label for="email">Email address</label>
							<input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required>
						</div>
						<div class="form-field field-wide">
							<label for="address">Residential address</label>
							<input type="text" id="address" name="address" autocomplete="street-address" placeholder="House number, street and area" required>
						</div>
						<div class="form-field">
							<label for="city">City</label>
							<input type="text" id="city" name="city" autocomplete="address-level2" required>
						</div>
						<div class="form-field">
							<label for="postalCode">Postal code</label>
							<input type="text" id="postalCode" name="postalCode" autocomplete="postal-code" pattern="[0-9]{6}" placeholder="6-digit PIN code" required>
						</div>
					</div>
				</fieldset>

				<fieldset>
					<legend>Account security</legend>
					<div class="form-grid">
						<div class="form-field">
							<label for="accountType">Account type</label>
							<select id="accountType" name="accountType" required>
								<option value="">Choose account type</option>
								<option>Savings account</option>
								<option>Current account</option>
							</select>
						</div>
						<div class="form-field">
							<label for="customerPassword">Create password</label>
							<input type="password" id="customerPassword" name="customerPassword" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
						</div>
						<div class="form-field field-wide">
							<label for="confirmPassword">Confirm password</label>
							<input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
						</div>
					</div>
				</fieldset>

				<label class="terms-check" for="terms">
					<input type="checkbox" id="terms" name="terms" required>
					<span>I agree to the account terms and privacy policy.</span>
				</label>

				<a class="kyc-link" id="kyc" href="#kyc-details">Approve KYC Before Registering</a>
				<button type="submit">Register account</button>
			</form>
		</section>
	</main>
</body>
</html>
