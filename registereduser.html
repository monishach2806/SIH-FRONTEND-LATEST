<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="ON.css">
</head>

<body id="main">
    <div class="login-box">
        <img class="auth-logo" src="logo.jpeg" alt="Srijian - Let AI Handle Your Finances">
        <h1>Welcome To SRIJIAN Bank!</h1>

        <div class="field-row">
            <label for="userId">USER ID:</label>
            <input type="text" id="userId" placeholder="Enter your User ID">
        </div>

        <div class="field-row">
            <label for="password">PASSWORD:</label>
            <input type="password" id="password" placeholder="Enter your Password">
        </div>

        <button>Login</button>
        <a href="forgot-password?">Forgot Password?</a>
        <div class="login-options">
            <a href="mobile-number">Use Mobile Number</a>
            <a href="barcode">Via Barcode</a>
        </div>
    </div>
</body>
</html>
