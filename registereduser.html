<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Srijian Bank - Login</title>

    <link rel="stylesheet" href="registereduser.css">
</head>

<body id="main">

    <div class="login-box">

        <img
            class="auth-logo"
            src="logo.jpeg"
            alt="Srijian - Let AI Handle Your Finances"
        >

        <h1>Welcome To SRIJIAN Bank!</h1>


        <div class="field-row">

            <label for="userId">
                USER ID:
            </label>

            <input
                type="text"
                id="userId"
                placeholder="Enter your User ID"
                autocomplete="username"
            >

        </div>


        <div class="field-row">

            <label for="password">
                PASSWORD:
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your Password"
                autocomplete="current-password"
            >

        </div>


        <button
            type="button"
            id="loginButton"
        >
            Login
        </button>


        <a href="#">
            Forgot Password?
        </a>


        <div class="login-options">

            <a href="#">
                Use Mobile Number
            </a>

            <a href="#">
                Via Barcode
            </a>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
